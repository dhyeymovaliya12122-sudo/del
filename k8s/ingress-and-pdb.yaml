apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: whatsapp-core-engine-pdb
  namespace: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: whatsapp-core-engine
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whatsapp-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: whatsapp-core-engine-svc
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.whatsapp-engine.internal
      secretName: whatsapp-tls-certs
  rules:
    - host: api.whatsapp-engine.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whatsapp-core-engine-svc
                port:
                  number: 3000
